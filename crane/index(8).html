<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Love & Sweets — Crane Game</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden;
  background:#252635;
  font-family:"Trebuchet MS",Arial,sans-serif;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
body{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100vw;
  max-width:100vw;
}

#rotateNotice{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:28px;
  background:#eef4ff;
  color:#59698d;
  font-size:22px;
  font-weight:900;
}

#stage{
  position:relative;
  width:min(100vw,177.7778vh);
  height:min(56.25vw,100vh);
  aspect-ratio:16/9;
  overflow:hidden;
  background:#4c5662;
}

/* Use the ACTUAL currently visible browser viewport.
   This keeps the 16:9 artwork proportional while allowing the crane
   machine to grow much larger than the conservative svh version. */
@supports (height:100dvh){
  body{
    width:100vw;
    height:100dvh;
    min-height:100dvh;
  }

  #stage{
    width:min(calc(100vw - 4px),calc((100dvh - 4px) * 1.777778));
    height:min(calc(56.25vw - 2px),calc(100dvh - 4px));
  }
}

@media (orientation:landscape) and (max-height:700px){
  #stage{
    width:min(calc(100vw - 4px),calc((100dvh - 4px) * 1.777778));
    height:min(calc(56.25vw - 2px),calc(100dvh - 4px));
  }

  #homeLink{
    top:2.3%;
  }

  #coinBox{
    top:2.3%;
  }
}

/* Full-canvas artwork layers */
.full-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
}

#machineBackground{z-index:1}
#machineBack{z-index:3}
#prizeBackdrop{z-index:4}
#prizeDropHole{z-index:5}
#prizeLayer{position:absolute;inset:0;z-index:10;pointer-events:none}
#clawLayer{position:absolute;inset:0;z-index:14;pointer-events:none}
#glassPrizeDrop{z-index:17}
#machineForeground{z-index:20 !important}
#machineBorder{z-index:24 !important}

/* Prize pieces */
.prize{
  position:absolute;
  width:9.4%;
  aspect-ratio:1/1;
  object-fit:contain;
  transform:translate(-50%,-50%);
  transform-origin:center;
  filter:drop-shadow(0 5px 4px rgba(0,0,0,.18));
  transition:
    left .48s ease,
    top .48s ease,
    transform .32s ease,
    opacity .32s ease;
}
.prize.held{
  will-change:left,top,transform;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transform:translate(-50%,-50%) scale(.90);
}
.prize.slipping{
  transition:
    left .48s ease-in,
    top .58s cubic-bezier(.3,.05,.72,1.15),
    transform .58s ease;
}
.prize.won{
  opacity:0;
  transform:translate(-50%,-50%) scale(.45) rotate(14deg);
}

/* Claw rig */
#wire{
  position:absolute;
  top:0;
  z-index:1;
  width:1.05%;
  min-width:4px;
  height:11%;
  object-fit:fill;
  transform:translateX(-50%);
  transform-origin:top center;
  transition:
    left .06s linear,
    height .58s ease-in-out;
}

#clawBox{
  position:absolute;
  z-index:2;
  width:10.2%;
  aspect-ratio:3 / 4;
  transform:translate(-50%,0);
  transform-origin:top center;
  transition:
    left .06s linear,
    top .58s ease-in-out;
  overflow:visible;
}

#claw{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  transform:none;
}

/* Joystick */
#joystick{
  position:absolute !important;
  z-index:500 !important;
  width:9.6%;
  left:83.0%;
  top:76.5%;
  transform:translate(-50%,-50%);
  object-fit:contain;
  cursor:grab;
  touch-action:none;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.14));
  isolation:isolate;
}
#joystick.dragging{cursor:grabbing}

/* Invisible button zones + HTML labels */
.machine-button{
  position:absolute;
  z-index:510;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.machine-button:disabled{cursor:default}

#dropButton{
  left:11.1%;
  top:84.0%;
  width:12.8%;
  height:15.0%;
}
#resetButton{
  left:31.5%;
  top:84.0%;
  width:13.2%;
  height:15.0%;
}

.button-label{
  position:absolute;
  z-index:511;
  transform:translate(-50%,-50%);
  pointer-events:none;
  text-align:center;
  font-weight:1000;
  line-height:1.05;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
#dropLabel{
  left:17.5%;
  top:91.5%;
  color:#385676;
  font-size:clamp(10px,1.7vw,27px);
}
#resetLabel{
  left:38.1%;
  top:91.2%;
  color:#755b68;
  font-size:clamp(8px,1.18vw,19px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:1px;
}

/* Back + coin UI */
#homeLink{
  position:absolute;
  z-index:60;
  left:1.5%;
  top:2.0%;
  border:3px solid white;
  border-radius:16px;
  padding:8px 12px;
  background:rgba(246,239,255,.95);
  color:#584a70;
  text-decoration:none;
  font-weight:1000;
  font-size:clamp(9px,1.15vw,18px);
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}

#coinBox{
  position:absolute;
  z-index:60;
  right:1.5%;
  top:2%;
  display:flex;
  align-items:center;
  gap:7px;
  border:3px solid white;
  border-radius:17px;
  padding:7px 11px;
  background:rgba(255,255,255,.94);
  color:#39445d;
  font-weight:1000;
  font-size:clamp(10px,1.2vw,19px);
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}
#coinBox img{
  width:clamp(18px,2.2vw,34px);
  height:clamp(18px,2.2vw,34px);
  object-fit:contain;
}

/* Status messages are intentionally hidden; the machine itself stays clean. */
#message{display:none !important}

/* Won item toast */
#winToast{
  position:absolute;
  z-index:100;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%) scale(.92);
  width:min(38%,380px);
  padding:15px;
  border:3px solid white;
  border-radius:22px;
  background:rgba(255,250,253,.98);
  box-shadow:0 12px 30px rgba(20,20,35,.24);
  text-align:center;
  color:#4f5873;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
}
#winToast.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
  pointer-events:auto;
}
#winToast img{
  width:min(40%,120px);
  aspect-ratio:1/1;
  object-fit:contain;
}
#winToast strong{
  display:block;
  color:#ff639d;
  font-size:clamp(14px,1.65vw,25px);
}
#winToast span{
  font-size:clamp(9px,1vw,15px);
  font-weight:900;
}

@media (orientation:portrait){
  #rotateNotice{display:flex}
  #stage{display:none}
}

.win-action-btn{
  border:0;
  border-radius:14px;
  padding:9px 13px;
  background:#eef3ff;
  color:#4f5873;
  text-decoration:none;
  font:inherit;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 2px 6px rgba(20,20,35,.12);
  pointer-events:auto;
}
.win-action-btn:active{
  transform:scale(.97);
}


.reset-cost{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  white-space:nowrap;
}
.reset-cost img{
  width:1.35em;
  height:1.35em;
  object-fit:contain;
  display:block;
}


#joystickTopLayer{
  position:absolute !important;
  inset:0 !important;
  z-index:500 !important;
  pointer-events:none !important;
}
#joystickTopLayer #joystick{
  pointer-events:auto !important;
}


/* PHONE LANDSCAPE:
   Zoom the whole 16:9 machine closer to full-screen without stretching.
   Bottom anchoring protects DROP / RESET; any crop happens at the top. */
@media (orientation:landscape) and (max-height:600px){
  #stage{
    transform:scale(1.24);
    transform-origin:center bottom;
  }

  #homeLink{
    top:8.2%;
    left:2.0%;
    padding:5px 9px;
    border-width:2px;
    border-radius:13px;
    font-size:clamp(8px,1vw,14px);
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }

  #coinBox{
    top:7.5%;
    right:2.0%;
    padding:5px 8px;
    border-width:2px;
    border-radius:14px;
    gap:5px;
    font-size:clamp(9px,1vw,15px);
    box-shadow:0 2px 6px rgba(0,0,0,.10);
  }

  #coinBox img{
    width:clamp(16px,1.8vw,26px);
    height:clamp(16px,1.8vw,26px);
  }
}

</style>
</head>
<body>

<div id="rotateNotice">Rotate your device sideways ♡</div>

<div id="stage">
  <!-- Rename/upload your crane artwork to these filenames in /images/ -->
  <img id="machineBackground" class="full-layer" src="../images/crane-game-background.png" alt="">
  <img id="machineBack" class="full-layer" src="../images/crane-game-back-of-machine.png" alt="">
  <img id="prizeBackdrop" class="full-layer" src="../images/background-prize.png" alt="">

  <img id="prizeDropHole" class="full-layer" src="../images/prize-drop-hole.png" alt="">

  <div id="prizeLayer"></div>

  <div id="clawLayer">
    <img id="wire" src="../images/crane-wire.png" alt="">
    <div id="clawBox"><img id="claw" src="../images/crane-open.png" alt=""></div>
  </div>

  <img id="glassPrizeDrop" class="full-layer" src="../images/crane-game-glass-prize-drop.png" alt="">
  <img id="machineForeground" class="full-layer" src="../images/crane-game-foreground.png" alt="">
  <img id="machineBorder" class="full-layer" src="../images/crane-game-border.png" alt="">

  <div id="joystickTopLayer" style="position:absolute;inset:0;z-index:500;pointer-events:none;">
    <img id="joystick" src="../images/joystick.png" alt="Joystick" style="pointer-events:auto;">
  </div>

  <button id="dropButton" class="machine-button" aria-label="Drop claw"></button>
  <button id="resetButton" class="machine-button" aria-label="Reset prizes"></button>
  <div id="dropLabel" class="button-label">DROP!</div>
  <div id="resetLabel" class="button-label">
    <span>RESET</span>
    <span class="reset-cost"><img src="../images/heart-coin.png" alt="">10</span>
  </div>

  <a id="homeLink" href="../">← Back to Home!</a>

  <div id="coinBox">
    <img src="../images/heart-coin.png" alt="">
    <span id="coinCount">0</span>
  </div>

  <div id="message">Drag the joystick to line up the claw ♡</div>

  <div id="winToast">
    <img id="winImage" src="" alt="">
    <strong id="winName"></strong>
    <span id="winText">Added to Inventory!</span>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;">
      <button id="keepPlayingBtn" class="win-action-btn">Keep Playing</button>
      <a id="winHomeBtn" class="win-action-btn" href="../">← Back to Home!</a>
    </div>
  </div>
</div>

<script>
const INVENTORY_SAVE_KEY="loveAndSweetsInventoryV1";
const HUB_SAVE_KEY="loveAndSweetsHubV1";
const CRANE_SAVE_KEY="loveAndSweetsCraneV1";

const prizeCatalog=[
  {
    id:"love-letter",
    name:"Love Letter",
    image:"../images/love-letter.png",
    rarity:"Common",
    catchChance:.50
  },
  {
    id:"teddy-bear",
    name:"Teddy Bear",
    image:"../images/teddy-bear.png",
    rarity:"Common",
    catchChance:.50
  },
  {
    id:"bouquet",
    name:"Bouquet",
    image:"../images/bouquet.png",
    rarity:"Uncommon",
    catchChance:.20
  },
  {
    id:"heart-locket",
    name:"Heart Locket",
    image:"../images/heart-locket.png",
    rarity:"Rare",
    catchChance:.10
  }
];

const stage=document.getElementById("stage");
const prizeLayer=document.getElementById("prizeLayer");
const wire=document.getElementById("wire");
const claw=document.getElementById("claw");
const clawBox=document.getElementById("clawBox");
const joystick=document.getElementById("joystick");
const dropButton=document.getElementById("dropButton");
const resetButton=document.getElementById("resetButton");
const coinCount=document.getElementById("coinCount");
const message=document.getElementById("message");
const winToast=document.getElementById("winToast");
const winImage=document.getElementById("winImage");
const winName=document.getElementById("winName");
const winText=document.getElementById("winText");
const keepPlayingBtn=document.getElementById("keepPlayingBtn");

let prizes=[];
let clawX=.205;               // normalized stage x
let busy=false;
let heldPrize=null;
let joystickPointer=null;
let joystickCenterX=0;
let joystickMaxPx=42;
let joystickTilt=0;
let movementFrame=null;
let lastMoveTime=performance.now();

/* Machine geometry in normalized 1920x1080 space. */
const CLAW_MIN_X=.205;
const CLAW_MAX_X=.805;
const CLAW_HOME_Y=.115;
const CLAW_CLOSED_Y=.545;
const CHUTE_X=.205;
const CHUTE_DROP_Y=.625;

function sleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}

function clamp(n,min,max){
  return Math.max(min,Math.min(max,n));
}

function getCoins(){
  return Number(localStorage.getItem("loveAndSweetsCoins")||0);
}

function setCoins(value){
  const safe=Math.max(0,Math.floor(Number(value)||0));
  localStorage.setItem("loveAndSweetsCoins",String(safe));
  coinCount.textContent=safe;

  /* Synchronize Bakery's coin save so it doesn't restore old coins later. */
  try{
    const raw=localStorage.getItem("loveAndSweetsBakeryV1");
    if(raw){
      const data=JSON.parse(raw);
      if(data && typeof data==="object"){
        data.coins=safe;
        localStorage.setItem("loveAndSweetsBakeryV1",JSON.stringify(data));
      }
    }
  }catch(e){}
}

function loadInventory(){
  try{
    const data=JSON.parse(localStorage.getItem(INVENTORY_SAVE_KEY));
    return data && typeof data==="object" ? data : {};
  }catch(e){
    return {};
  }
}

function saveInventory(inv){
  localStorage.setItem(INVENTORY_SAVE_KEY,JSON.stringify(inv));
}

function addInventoryItem(id){
  const inv=loadInventory();
  inv[id]=Number(inv[id]||0)+1;
  saveInventory(inv);
}

function incrementCraneWins(){
  let hub={};
  try{
    const saved=JSON.parse(localStorage.getItem(HUB_SAVE_KEY));
    if(saved && typeof saved==="object") hub=saved;
  }catch(e){}

  hub.cranePrizes=Number(hub.cranePrizes||0)+1;

  if(typeof hub.shiyuAffection!=="number") hub.shiyuAffection=0;
  if(typeof hub.yukineAffection!=="number") hub.yukineAffection=0;
  if(typeof hub.shiyuPokes!=="number") hub.shiyuPokes=0;
  if(typeof hub.yukinePokes!=="number") hub.yukinePokes=0;

  localStorage.setItem(HUB_SAVE_KEY,JSON.stringify(hub));
}

function choosePrize(){
  const roll=Math.random();
  const rarity=roll<.65 ? "Common" : roll<.95 ? "Uncommon" : "Rare";
  const pool=prizeCatalog.filter(p=>p.rarity===rarity);
  return pool[Math.floor(Math.random()*pool.length)];
}

function newPrizeLayout(){
  /* Five medium prizes spread loosely across the MAIN floor area.
     Keep the left-side prize chute completely clear. */
  const lanes=[.365,.455,.545,.635,.725];
  const yRows=[.635,.655,.625,.662,.640];

  prizes=lanes.map((x,i)=>{
    const item=choosePrize();
    return {
      uid:`${Date.now()}-${i}-${Math.random()}`,
      id:item.id,
      name:item.name,
      image:item.image,
      rarity:item.rarity,
      catchChance:item.catchChance,
      x:clamp(x+(Math.random()-.5)*.035,.34,.755),
      y:clamp(yRows[i]+(Math.random()-.5)*.022,.60,.685),
      rotation:(Math.random()-.5)*15
    };
  });

  saveCraneState();
  renderPrizes();
}

function saveCraneState(){
  localStorage.setItem(CRANE_SAVE_KEY,JSON.stringify({
    prizes,
    clawX
  }));
}

function loadCraneState(){
  try{
    const saved=JSON.parse(localStorage.getItem(CRANE_SAVE_KEY));
    if(saved && Array.isArray(saved.prizes) && saved.prizes.length){
      prizes=saved.prizes;
      clawX=typeof saved.clawX==="number" ? clamp(saved.clawX,CLAW_MIN_X,CLAW_MAX_X) : clawX;
      return true;
    }
  }catch(e){}
  return false;
}


function normalizeExistingCraneState(){
  let changed=false;

  if(clawX < CLAW_MIN_X || clawX > CLAW_MAX_X){
    clawX=CHUTE_X;
    changed=true;
  }

  prizes.forEach((p,i)=>{
    if(p.x<.34 || p.x>.755 || p.y<.59 || p.y>.70){
      const lanes=[.365,.455,.545,.635,.725];
      p.x=lanes[i%lanes.length]+(Math.random()-.5)*.025;
      p.y=.64+(Math.random()-.5)*.035;
      changed=true;
    }
  });

  if(changed) saveCraneState();
}

function renderPrizes(){
  prizeLayer.innerHTML="";
  prizes.forEach(p=>{
    const img=document.createElement("img");
    img.className="prize";
    img.dataset.uid=p.uid;
    img.src=p.image;
    img.alt=p.name;
    img.style.left=`${p.x*100}%`;
    img.style.top=`${p.y*100}%`;
    img.style.transform=`translate(-50%,-50%) rotate(${p.rotation||0}deg)`;
    prizeLayer.appendChild(img);
  });
}

function prizeElement(uid){
  return prizeLayer.querySelector(`[data-uid="${uid}"]`);
}

function setMessage(text){
  message.textContent=text;
}

function setClawImage(closed){
  claw.src=closed
    ? "../images/crane-close.png"
    : "../images/crane-open.png";
}

function stageHeight(){
  return stage.getBoundingClientRect().height;
}

function setClawPosition(x=clawX,y=CLAW_HOME_Y,animate=true){
  clawX=clamp(x,CLAW_MIN_X,CLAW_MAX_X);

  const h=stageHeight();

  /* This is the TOP of the claw container. */
  const clawTop=y*h;

  /* Let the wire continue a little way UNDER the claw's pink cap.
     Because the claw is z-index 2 and the wire is z-index 1,
     this overlap is hidden and there is never a visible gap. */
  const wireOverlap=Math.max(12,h*.018);
  const wireHeight=Math.max(8,clawTop+wireOverlap);

  wire.style.transition=animate
    ? "left .06s linear,height .58s ease-in-out"
    : "none";

  clawBox.style.transition=animate
    ? "left .06s linear,top .58s ease-in-out"
    : "none";

  wire.style.left=`${clawX*100}%`;
  wire.style.height=`${wireHeight}px`;

  clawBox.style.left=`${clawX*100}%`;
  clawBox.style.top=`${clawTop}px`;

  if(heldPrize){
    const el=prizeElement(heldPrize.uid);
    if(el){
      /* When lifting/dropping vertically, ease the prize at the same
         speed as the claw. During frame-by-frame horizontal travel,
         use no transition so it stays physically attached with no flashing. */
      el.classList.add("held");
      el.style.transition=animate
        ? "left .06s linear, top .58s ease-in-out, transform .32s ease"
        : "none";
      el.style.left=`${clawX*100}%`;
      el.style.top=`${Math.min(.78,y+.16)*100}%`;
      el.style.transform="translate(-50%,-50%) scale(.90)";
    }
  }
}

function syncClawInstant(){
  setClawPosition(clawX,CLAW_HOME_Y,false);
  requestAnimationFrame(()=>{
    wire.style.transition="";
    clawBox.style.transition="";
  });
}

function closestPrize(){
  if(!prizes.length) return null;

  let best=null;
  let bestDx=Infinity;
  for(const p of prizes){
    const dx=Math.abs(p.x-clawX);
    if(dx<bestDx){
      best=p;
      bestDx=dx;
    }
  }

  /* Medium/easy target window. */
  return bestDx<=.052 ? best : null;
}

function startJoystickMovement(){
  if(movementFrame) return;
  lastMoveTime=performance.now();

  const tick=(now)=>{
    const dt=Math.min(.04,(now-lastMoveTime)/1000);
    lastMoveTime=now;

    if(!busy && Math.abs(joystickTilt)>.08){
      const speed=.29; // normalized stage width per second at full tilt
      clawX=clamp(
        clawX + joystickTilt*speed*dt,
        CLAW_MIN_X,
        CLAW_MAX_X
      );
      setClawPosition(clawX,CLAW_HOME_Y,false);
      saveCraneState();
    }

    movementFrame=requestAnimationFrame(tick);
  };

  movementFrame=requestAnimationFrame(tick);
}

function stopJoystickMovement(){
  if(movementFrame){
    cancelAnimationFrame(movementFrame);
    movementFrame=null;
  }
}

joystick.addEventListener("pointerdown",(e)=>{
  if(busy) return;

  joystickPointer=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  joystick.classList.add("dragging");

  const box=joystick.getBoundingClientRect();
  joystickCenterX=box.left+box.width/2;

  const stageBox=stage.getBoundingClientRect();
  joystickMaxPx=Math.max(28,stageBox.width*.032);

  startJoystickMovement();
  e.preventDefault();
});

joystick.addEventListener("pointermove",(e)=>{
  if(e.pointerId!==joystickPointer || busy) return;

  const dx=clamp(e.clientX-joystickCenterX,-joystickMaxPx,joystickMaxPx);
  joystickTilt=dx/joystickMaxPx;
  joystick.style.transform=`translate(calc(-50% + ${dx}px),-50%) rotate(${joystickTilt*8}deg)`;
  e.preventDefault();
});

function releaseJoystick(e){
  if(joystickPointer===null) return;
  if(e && e.pointerId!==joystickPointer) return;

  try{
    joystick.releasePointerCapture(joystickPointer);
  }catch(err){}

  joystickPointer=null;
  joystickTilt=0;
  joystick.classList.remove("dragging");
  joystick.style.transition="transform .18s ease";
  joystick.style.transform="translate(-50%,-50%) rotate(0deg)";

  setTimeout(()=>{
    joystick.style.transition="";
  },190);

  stopJoystickMovement();
}

joystick.addEventListener("pointerup",releaseJoystick);
joystick.addEventListener("pointercancel",releaseJoystick);

async function showWinToast(prize,machineCleared=false){
  winImage.src=prize.image;
  winName.textContent=prize.name;
  winText.textContent=machineCleared
    ? "Added to Inventory! Machine cleared — +20 Heart Coins! ♡"
    : "Added to Inventory!";
  winToast.classList.add("show");

  await new Promise(resolve=>{
    const handler=()=>{
      keepPlayingBtn.removeEventListener("click",handler);
      winToast.classList.remove("show");
      resolve();
    };
    keepPlayingBtn.addEventListener("click",handler);
  });
}


async function returnClawToHome(){
  /* First make sure the claw is fully raised. */
  setClawPosition(clawX,CLAW_HOME_Y,true);
  await sleep(580);

  if(Math.abs(clawX-CHUTE_X)>.002){
    const startX=clawX;
    const duration=620;
    const started=performance.now();

    await new Promise(resolve=>{
      const animate=(now)=>{
        const t=clamp((now-started)/duration,0,1);
        const eased=t<.5
          ? 2*t*t
          : 1-Math.pow(-2*t+2,2)/2;

        const x=startX+(CHUTE_X-startX)*eased;
        setClawPosition(x,CLAW_HOME_Y,false);

        if(t<1){
          requestAnimationFrame(animate);
        }else{
          resolve();
        }
      };
      requestAnimationFrame(animate);
    });
  }

  clawX=CHUTE_X;
  setClawPosition(clawX,CLAW_HOME_Y,false);
  setClawImage(false);
  saveCraneState();
}

async function dropClaw(){
  if(busy) return;

  busy=true;
  dropButton.disabled=true;
  resetButton.disabled=true;
  releaseJoystick();

  const target=closestPrize();

  setMessage(target ? `Trying for ${target.name}…` : "The claw drops…");
  setClawImage(false);

  /* Lower the open claw. */
  setClawPosition(clawX,CLAW_CLOSED_Y,true);
  await sleep(620);

  /* Close at the bottom. */
  setClawImage(true);
  await sleep(320);

  if(!target){
    setMessage("Nothing there! Try lining it up a little closer ♡");
    await sleep(280);

    /* Real crane behavior: every attempt returns to the home/chute side. */
    await returnClawToHome();

    busy=false;
    dropButton.disabled=false;
    resetButton.disabled=false;
    return;
  }

  /* Visually pick the target up. */
  heldPrize=target;
  const targetEl=prizeElement(target.uid);
  if(targetEl){
    targetEl.classList.add("held");
  }

  /* Rise with prize attached. */
  setClawPosition(clawX,.265,true);
  await sleep(600);

  const won=Math.random()<target.catchChance;

  if(!won){
    /* Prize slips from the claw and drops back to the floor. */
    setMessage(`${target.name} slipped! So close!`);

    heldPrize=null;

    if(targetEl){
      targetEl.classList.remove("held");
      targetEl.style.transition="";
      targetEl.classList.add("slipping");

      target.x=clamp(target.x+(Math.random()-.5)*.025,.34,.755);
      target.y=clamp(target.y+(Math.random()-.5)*.012,.61,.69);
      target.rotation=(Math.random()-.5)*22;

      targetEl.style.left=`${target.x*100}%`;
      targetEl.style.top=`${target.y*100}%`;
      targetEl.style.transform=`translate(-50%,-50%) rotate(${target.rotation}deg)`;
    }

    await sleep(620);

    if(targetEl) targetEl.classList.remove("slipping");

    /* Even on a failed grip, return to the machine's default start position. */
    await returnClawToHome();

    busy=false;
    dropButton.disabled=false;
    resetButton.disabled=false;
    return;
  }

  /* Successful grip: lift to the top. */
  setMessage(`It held! Taking ${target.name} to the prize chute…`);
  setClawPosition(clawX,CLAW_HOME_Y,true);
  await sleep(580);

  /* Travel horizontally LEFT back to the prize chute. */
  const startX=clawX;
  const travelDuration=760;
  const started=performance.now();

  await new Promise(resolve=>{
    const animate=(now)=>{
      const t=clamp((now-started)/travelDuration,0,1);
      const eased=t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
      const x=startX+(CHUTE_X-startX)*eased;
      setClawPosition(x,CLAW_HOME_Y,false);

      if(t<1){
        requestAnimationFrame(animate);
      }else{
        resolve();
      }
    };
    requestAnimationFrame(animate);
  });

  await sleep(180);

  /* Open above chute and let the prize fall in. */
  setClawImage(false);
  heldPrize=null;

  if(targetEl){
    targetEl.classList.remove("held");

    /* First sit directly beneath the open claw over the chute... */
    targetEl.style.transition="left .12s linear, top .12s linear, transform .12s linear";
    targetEl.style.left=`${CHUTE_X*100}%`;
    targetEl.style.top="28%";
    targetEl.style.transform="translate(-50%,-50%) scale(.88)";
    await sleep(150);

    /* ...then visibly fall DOWN into the left prize chute. */
    targetEl.style.transition="top .58s cubic-bezier(.35,.02,.72,1), transform .58s ease, opacity .18s ease .42s";
    targetEl.style.top=`${CHUTE_DROP_Y*100}%`;
    targetEl.style.transform="translate(-50%,-50%) scale(.72) rotate(-8deg)";
    await sleep(500);
    targetEl.classList.add("won");
  }

  await sleep(180);

  addInventoryItem(target.id);
  incrementCraneWins();

  prizes=prizes.filter(p=>p.uid!==target.uid);
  const machineCleared=prizes.length===0;

  /* Clearing all five prizes grants a free 20-coin bonus. */
  if(machineCleared){
    setCoins(getCoins()+20);
  }

  saveCraneState();

  setMessage(`You won ${target.name}! Added to Inventory ♡`);
  await showWinToast(target,machineCleared);

  /* The crane's resting position is always above the prize chute. */
  clawX=CHUTE_X;
  setClawPosition(clawX,CLAW_HOME_Y,false);

  if(machineCleared){
    /* Free automatic refill after clearing the machine. */
    newPrizeLayout();
  }else{
    renderPrizes();
    saveCraneState();
  }

  busy=false;
  dropButton.disabled=false;
  resetButton.disabled=false;
}

function resetPrizes(){
  if(busy) return;

  const coins=getCoins();
  if(coins<10){
    setMessage("Not enough Heart Coins to reset! You need 10 ♡");
    return;
  }

  setCoins(coins-10);
  clawX=CHUTE_X;
  setClawPosition(clawX,CLAW_HOME_Y,false);
  newPrizeLayout();
}

dropButton.addEventListener("click",dropClaw);
resetButton.addEventListener("click",resetPrizes);

window.addEventListener("resize",()=>{
  syncClawInstant();
});

setCoins(getCoins());

if(!loadCraneState()){
  clawX=CHUTE_X;
  newPrizeLayout();
}else{
  normalizeExistingCraneState();
  renderPrizes();
}

syncClawInstant();
</script>
