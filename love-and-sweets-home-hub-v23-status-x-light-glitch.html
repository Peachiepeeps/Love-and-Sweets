<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Love & Sweets</title>
<style>
:root{
  --ink:#27314a;
  --shadow:rgba(25,35,65,.18);
  --pink:#ff5a9a;
  --panel:rgba(255,255,255,.78);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:var(--ink);
  background:#dfe6f4;
}
body{
  min-height:100vh;
  margin:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#202536;
}

#app{
  position:relative;
  width:min(100vw, calc(100vh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  aspect-ratio:16 / 9;
  overflow:hidden;
  background:#dfe6f4;
}

.room-stage{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.room-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  user-select:none;
  pointer-events:none;
}

.rotate-screen{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#eef2f7;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.rotate-card{
  background:rgba(255,255,255,.92);
  border:3px solid white;
  border-radius:26px;
  box-shadow:0 12px 30px rgba(35,45,70,.18);
  padding:24px 28px;
  color:#536797;
  font-weight:900;
  font-size:20px;
  line-height:1.4;
}

.rotate-phone{
  display:block;
  font-size:48px;
  margin-bottom:10px;
  animation:rotateHint 1.8s ease-in-out infinite alternate;
}

@keyframes rotateHint{
  from{transform:rotate(0deg)}
  to{transform:rotate(90deg)}
}

@media (orientation:portrait){
  #app{display:none}
  .rotate-screen{display:flex}
}



.shiyu-pixel-out{
  animation:shiyuGlitchOut .44s steps(1,end) forwards;
}

.shiyu-pixel-in{
  animation:shiyuGlitchIn .44s steps(1,end) forwards;
}

@keyframes shiyuGlitchOut{
  0%{
    opacity:1;
    transform:translate(0,0);
    filter:none;
  }
  18%{
    opacity:.92;
    transform:translate(-2px,0);
    filter:contrast(1.15) drop-shadow(2px 0 0 rgba(110,205,255,.34));
  }
  34%{
    opacity:.82;
    transform:translate(3px,-1px);
    filter:contrast(1.25) drop-shadow(-2px 0 0 rgba(255,135,195,.30));
  }
  51%{
    opacity:.66;
    transform:translate(-3px,1px);
    filter:contrast(1.35) drop-shadow(2px 0 0 rgba(110,205,255,.28));
  }
  68%{
    opacity:.45;
    transform:translate(2px,0);
    filter:contrast(1.45);
  }
  84%{
    opacity:.22;
    transform:translate(-1px,-1px);
    filter:contrast(1.55);
  }
  100%{
    opacity:0;
    transform:translate(0,0);
    filter:contrast(1.6);
  }
}

@keyframes shiyuGlitchIn{
  0%{
    opacity:0;
    transform:translate(0,0);
    filter:contrast(1.6);
  }
  18%{
    opacity:.20;
    transform:translate(2px,1px);
    filter:contrast(1.5);
  }
  35%{
    opacity:.42;
    transform:translate(-3px,0);
    filter:contrast(1.4) drop-shadow(2px 0 0 rgba(110,205,255,.28));
  }
  53%{
    opacity:.64;
    transform:translate(3px,-1px);
    filter:contrast(1.3) drop-shadow(-2px 0 0 rgba(255,135,195,.28));
  }
  70%{
    opacity:.82;
    transform:translate(-2px,1px);
    filter:contrast(1.2);
  }
  86%{
    opacity:.94;
    transform:translate(1px,0);
    filter:contrast(1.1);
  }
  100%{
    opacity:1;
    transform:translate(0,0);
    filter:none;
  }
}

.overlay{

.phone-art{

.status-panel{

}

.status-panel.show{

.status-close{

.status-title{

.status-section{

}
.games-panel.show{display:block}
.games-title{
  text-align:center;
  font-size:24px;
  font-weight:900;
  color:#ff5a9a;

}
.games-btn{

  border:0;
  border-radius:18px;
  padding:13px 14px;
  margin-bottom:10px;
  font:inherit;
  font-weight:900;
  color:#32476f;
  background:#dce6fb;
  box-shadow:0 5px 14px rgba(70,85,130,.12);
}
.games-btn.secondary{background:#f0dce5}
.games-btn:active{transform:scale(.99)}

.note-toast{
  position:absolute;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  z-index:70;
  background:rgba(255,255,255,.94);
  border:3px solid white;
  border-radius:18px;

  font-weight:900;
  color:#7a4d68;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.note-toast.show{opacity:1}

/* ===== MOBILE LANDSCAPE: FULLSCREEN, NO STRETCH ===== */
@media (max-width:950px) and (orientation:landscape){

  html,
  body{
    position:fixed !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    margin:0 !important;
    padding:0 !important;
    overflow:hidden !important;
    background:#eef2f7 !important;
  }

  body{
    display:block !important;
  }

  #app{
    position:fixed !important;
    inset:0 !important;
    width:100vw !important;
    height:100dvh !important;
    max-width:none !important;
    max-height:none !important;
    aspect-ratio:auto !important;
    margin:0 !important;
    padding:0 !important;
    overflow:hidden !important;
    background:#eef2f7 !important;
  }

  .room-stage{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    overflow:hidden !important;
  }

  /* Preserve the actual 1920×1080 art proportions.
     Wide phone screens crop a little from the TOP, keeping feet visible. */
  .room-layer:not(.phone-room-layer){
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    object-fit:cover !important;
    object-position:center bottom !important;
  }

  /* The phone launcher is UI, so keep its entire full-canvas placement
     instead of letting the top crop cut it off. */
  .phone-room-layer{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    object-fit:fill !important;
  }

  .top-ui{
    top:max(6px,env(safe-area-inset-top)) !important;
    left:max(6px,env(safe-area-inset-left)) !important;
    right:max(6px,env(safe-area-inset-right)) !important;
  }

  .coins-box{
    padding:6px 9px !important;
    border-radius:13px !important;
    font-size:11px !important;
  }

  .coins-box img{
    width:18px !important;
    height:18px !important;
  }

  /* Keep the phone popup behavior from v9. */
  .phone-modal{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    max-width:none !important;
    max-height:none !important;
    aspect-ratio:auto !important;
  }

  .phone-art{
    width:100% !important;
    height:100% !important;
    object-fit:fill !important;
  }

  .phone-text{
    font-size:clamp(10px,1.8vw,15px) !important;
  }

  .hot-close{
    left:64.5% !important;
    top:1.2% !important;
    width:7% !important;
    height:11% !important;
    z-index:30 !important;
  }
}

</style>

<body>

const shiyuTap=document.getElementById("shiyuTap");
const yukineTap=document.getElementById("yukineTap");

const btnGames=document.getElementById("btnGames");
const btnStatus=document.getElementById("btnStatus");
const btnDate=document.getElementById("btnDate");
const gamesPanel=document.getElementById("gamesPanel");
const statusPanel=document.getElementById("statusPanel");
const closeStatus=document.getElementById("closeStatus");
const shiyuHearts=document.getElementById("shiyuHearts");
const yukineHearts=document.getElementById("yukineHearts");
const shiyuAffectionText=document.getElementById("shiyuAffectionText");
const yukineAffectionText=document.getElementById("yukineAffectionText");
const statusCoins=document.getElementById("statusCoins");
const statusCloseX=document.getElementById("statusCloseX");
const statusShiyuPokes=document.getElementById("statusShiyuPokes");
const statusYukinePokes=document.getElementById("statusYukinePokes");
const statusBakeryWins=document.getElementById("statusBakeryWins");
const statusCranePrizes=document.getElementById("statusCranePrizes");
const goBakery=document.getElementById("goBakery");
const goCrane=document.getElementById("goCrane");
const closeGames=document.getElementById("closeGames");
const toast=document.getElementById("toast");

function updateCoins(){
  coinCount.textContent = localStorage.getItem("loveAndSweetsCoins") || "0";
}
function syncBakeryCoins(){
  const bakeryState=localStorage.getItem("loveAndSweetsBakeryV1");
  if(!bakeryState) return;
  try{
    const data=JSON.parse(bakeryState);
    if(data && typeof data.coins==="number"){
      localStorage.setItem("loveAndSweetsCoins", String(data.coins));
    }
  }catch(e){}
}
function chooseWindow(){
  const hour=new Date().getHours();
  if(hour>=7 && hour<17){
    windowView.src="images/win-day.png";
  }else if(hour>=17 && hour<20){
    windowView.src="images/win-sunset.png";
  }else{
    windowView.src="images/win-night.png";
  }
}
function showToast(text){
  toast.textContent=text;
  toast.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>toast.classList.remove("show"),1500);
}
function openPhone(){
  shiyuTap.style.pointerEvents="none";
  gamesPanel.classList.remove("show");
  statusPanel.classList.remove("show");

  /* Shiyu pixelates out of the room first. */
  shiyuRoomLayers.forEach(layer=>{
    layer.classList.remove("shiyu-pixel-in");
    layer.classList.add("shiyu-pixel-out");
  });

  setTimeout(()=>{
    shiyuRoomLayers.forEach(layer=>{
      layer.style.visibility="hidden";
      layer.classList.remove("shiyu-pixel-out");
    });

    phoneOverlay.classList.add("show");

    uiPhoneReaction.locked=false;
    uiPhoneReaction.count=0;
    clearTimeout(uiPhoneReaction.faceTimer);
    clearTimeout(uiPhoneReaction.streakTimer);

    uiShiyuFace.src="images/uishiyu-happy.png";
    uiSpeechText.textContent="Hello!";

    uiPhoneReaction.faceTimer=setTimeout(()=>{
      if(!uiPhoneReaction.locked){
        uiShiyuFace.src="images/uishiyu-neutral.png";
        uiSpeechText.textContent="";
      }
    },1500);
  },440);
}
function closePhone(){
  clearTimeout(uiPhoneReaction.faceTimer);
  clearTimeout(uiPhoneReaction.streakTimer);

  uiPhoneReaction.locked=true;
  uiPhoneReaction.count=0;
  uiShiyuFace.src="images/uishiyu-angry.png";
  uiSpeechText.textContent="…";

  setTimeout(()=>{
    phoneOverlay.classList.remove("show");
    gamesPanel.classList.remove("show");
    statusPanel.classList.remove("show");

    uiShiyuFace.src="images/uishiyu-neutral.png";
    uiSpeechText.textContent="";
    uiPhoneReaction.locked=false;

    shiyuRoomLayers.forEach(layer=>{
      layer.style.visibility="visible";
      layer.classList.remove("shiyu-pixel-out");
      layer.classList.add("shiyu-pixel-in");
    });

    setTimeout(()=>{
      shiyuRoomLayers.forEach(layer=>layer.classList.remove("shiyu-pixel-in"));
      shiyuTap.style.pointerEvents="auto";
    },440);
  },650);
}


/* Persistent Home Hub progression */
const HUB_SAVE_KEY="loveAndSweetsHubV1";

const hubState={
  shiyuAffection:0,   // 0-1000 internally = 0-10 hearts
  yukineAffection:0,
  shiyuPokes:0,
  yukinePokes:0,
  cranePrizes:0
};

function loadHubState(){
  const raw=localStorage.getItem(HUB_SAVE_KEY);
  if(!raw) return;

  try{
    const saved=JSON.parse(raw);
    Object.assign(hubState,saved);
  }catch(e){}
}

function saveHubState(){
  localStorage.setItem(HUB_SAVE_KEY,JSON.stringify(hubState));
}

function affectionHearts(points){
  const hearts=Math.max(0,Math.min(10,Math.floor(points/100)));
  return "♥".repeat(hearts)+"♡".repeat(10-hearts);
}

function affectionLevel(points){
  return Math.max(0,Math.min(10,Math.floor(points/100)));
}

function getBakeryStats(){
  const raw=localStorage.getItem("loveAndSweetsBakeryV1");

  if(!raw){
    return {coins:Number(localStorage.getItem("loveAndSweetsCoins")||0),bakeryWins:0};
  }

  try{
    const data=JSON.parse(raw);
    return {
      coins:typeof data.coins==="number" ? data.coins : Number(localStorage.getItem("loveAndSweetsCoins")||0),
      bakeryWins:typeof data.bakeryWins==="number" ? data.bakeryWins : 0
    };
  }catch(e){
    return {coins:Number(localStorage.getItem("loveAndSweetsCoins")||0),bakeryWins:0};
  }
}

function renderStatus(){
  const bakery=getBakeryStats();

  shiyuHearts.textContent=affectionHearts(hubState.shiyuAffection);
  yukineHearts.textContent=affectionHearts(hubState.yukineAffection);

  shiyuAffectionText.textContent=`Affection: ${affectionLevel(hubState.shiyuAffection)} / 10`;
  yukineAffectionText.textContent=`Affection: ${affectionLevel(hubState.yukineAffection)} / 10`;

  statusCoins.textContent=bakery.coins;
  statusShiyuPokes.textContent=hubState.shiyuPokes;
  statusYukinePokes.textContent=hubState.yukinePokes;
  statusBakeryWins.textContent=bakery.bakeryWins;
  statusCranePrizes.textContent=hubState.cranePrizes;
}

/* Character tap reactions
   - normal tap: happy/blushing for 1.5 seconds
   - 5 quick taps: Shiyu gets angry / Yukine gets shocked
   - streak resets if you leave them alone for 3 seconds
*/
const tapReactions={
  shiyu:{
    count:0,
    locked:false,
    streakTimer:null,
    faceTimer:null,
    face:shiyuRoomFace,
    happy:"images/shiyu-happy.png",
    annoyed:"images/shiyu-angry.png",
    neutral:"images/shiyu-neutral.png"
  },
  yukine:{
    count:0,
    locked:false,
    streakTimer:null,
    faceTimer:null,
    face:yukineRoomFace,
    happy:"images/yukine-happy.png",
    annoyed:"images/yukine-shocked.png",
    neutral:"images/yukine-neutral.png"
  }
};

function reactToTap(character){
  const data=tapReactions[character];

  /* While angry/shocked is active, ignore extra taps. */
  if(data.locked) return;

  /* Count every accepted poke permanently. */
  if(character==="shiyu"){
    hubState.shiyuPokes++;
  }else{
    hubState.yukinePokes++;
  }
  saveHubState();

  data.count++;

  clearTimeout(data.streakTimer);
  clearTimeout(data.faceTimer);

  if(data.count>=5){
    data.locked=true;
    data.face.src=data.annoyed;
    data.count=0;

    data.faceTimer=setTimeout(()=>{
      data.face.src=data.neutral;
      data.locked=false;
    },3000);
  }else{
    data.face.src=data.happy;

    data.faceTimer=setTimeout(()=>{
      data.face.src=data.neutral;
    },1500);
  }

  data.streakTimer=setTimeout(()=>{
    data.count=0;
  },3000);
}

shiyuTap.addEventListener("click",()=>reactToTap("shiyu"));
yukineTap.addEventListener("click",()=>reactToTap("yukine"));



/* UI Shiyu reactions
   - open phone: happy + "Hello!" for 1.5 sec
   - normal tap: happy + "Hey!" for 1.5 sec
   - 5 quick taps: angry + "Stop that…" for 3 sec
   - while angry, extra taps are ignored
   - close phone: brief angry + "…" before closing
*/
const uiPhoneReaction={
  count:0,
  locked:false,
  streakTimer:null,
  faceTimer:null
};

function reactToUIShiyu(){
  if(uiPhoneReaction.locked) return;

  hubState.shiyuPokes++;
  saveHubState();

  uiPhoneReaction.count++;

  clearTimeout(uiPhoneReaction.streakTimer);
  clearTimeout(uiPhoneReaction.faceTimer);

  if(uiPhoneReaction.count>=5){
    uiPhoneReaction.locked=true;
    uiPhoneReaction.count=0;

    uiShiyuFace.src="images/uishiyu-angry.png";
    uiSpeechText.textContent="Stop that…";

    uiPhoneReaction.faceTimer=setTimeout(()=>{
      uiShiyuFace.src="images/uishiyu-neutral.png";
      uiSpeechText.textContent="";
      uiPhoneReaction.locked=false;
    },3000);
  }else{
    uiShiyuFace.src="images/uishiyu-happy.png";
    uiSpeechText.textContent="Hey!";

    uiPhoneReaction.faceTimer=setTimeout(()=>{
      uiShiyuFace.src="images/uishiyu-neutral.png";
      uiSpeechText.textContent="";
    },1500);
  }

  uiPhoneReaction.streakTimer=setTimeout(()=>{
    uiPhoneReaction.count=0;
  },3000);
}

uiShiyuTap.addEventListener("click",reactToUIShiyu);


phoneOpenBtn.addEventListener("click",openPhone);
phoneCloseBtn.addEventListener("click",closePhone);

btnGames.addEventListener("click",()=>{
  gamesPanel.classList.add("show");
});
closeGames.addEventListener("click",()=>gamesPanel.classList.remove("show"));
btnInventory.addEventListener("click",()=>showToast("Inventory coming soon ♡"));
btnShop.addEventListener("click",()=>showToast("Shop coming soon ♡"));
btnStatus.addEventListener("click",()=>{
  gamesPanel.classList.remove("show");
  renderStatus();
  statusPanel.classList.add("show");
});

closeStatus.addEventListener("click",()=>{
  statusPanel.classList.remove("show");
});

statusCloseX.addEventListener("click",()=>{
  statusPanel.classList.remove("show");
});
btnDate.addEventListener("click",()=>showToast("Dates coming soon ♡"));
goCrane.addEventListener("click",()=>showToast("Crane Machine coming soon ♡"));
goBakery.addEventListener("click",()=>{ window.location.href="bakery/"; });

phoneOverlay.addEventListener("click",(e)=>{
  if(e.target===phoneOverlay) closePhone();
});

loadHubState();
chooseWindow();
syncBakeryCoins();
updateCoins();
renderStatus();

</script>
