<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Love & Sweets</title>
<style>
:root{
  --ink:#27314a;
  --soft:#f6f8ff;
  --shadow:rgba(25,35,65,.18);
  --pink:#e4b8ca;
  --lav:#d8d1f1;
  --gold:#d8b55a;
  --gold2:#f0d587;
  --blue:#536797;
  --blue2:#3f4f7f;
  --panel:rgba(255,255,255,.72);
}

*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:var(--ink);
  background:#dfe6f4;
}
body{
  min-height:100vh;
  overflow:hidden;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* Room */
.room-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  user-select:none;
  pointer-events:none;
}
.window-layer{
  position:absolute;
  left:39.2%;
  top:15.2%;
  width:min(20vw, 260px);
  height:auto;
  z-index:2;
  user-select:none;
  pointer-events:none;
}
.char{
  position:absolute;
  user-select:none;
  pointer-events:none;
}
.char img{
  position:absolute;
  left:0; top:0;
  width:100%;
  height:100%;
  object-fit:contain;
}
#shiyuRoom{
  left:8.5%;
  bottom:9%;
  width:min(22vw, 220px);
  aspect-ratio:1000/1400;
  z-index:5;
}
#yukineRoom{
  right:8%;
  bottom:8%;
  width:min(24vw, 250px);
  aspect-ratio:1000/1400;
  z-index:5;
}

.top-ui{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  z-index:20;
  pointer-events:none;
}
.logo-box, .coins-box{
  background:var(--panel);
  border:3px solid white;
  border-radius:18px;
  box-shadow:0 5px 16px var(--shadow);
  padding:10px 14px;
  pointer-events:auto;
}
.logo-box{
  font-weight:900;
  color:#ff5a9a;
  text-shadow:0 1px 0 white;
}
.coins-box{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:900;
}
.coins-box img{
  width:24px;
  height:24px;
  object-fit:contain;
}

.phone-launch{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  z-index:25;
  width:min(120px, 24vw);
  background:none;
  border:0;
  padding:0;
}
.phone-launch .icon-wrap{
  position:relative;
  width:100%;
}
.phone-launch img{
  display:block;
  width:100%;
  height:auto;
}
.phone-launch span{
  position:absolute;
  left:50%;
  top:16%;
  transform:translateX(-50%);
  font-weight:900;
  font-size:14px;
  color:white;
  letter-spacing:.8px;
  text-shadow:0 1px 3px rgba(0,0,0,.28);
}
.phone-launch:active{transform:translateX(-50%) scale(.98)}

/* Overlay / phone */
.overlay{
  position:absolute;
  inset:0;
  background:rgba(22,29,49,.42);
  backdrop-filter:blur(2px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:40;
  padding:14px;
}
.overlay.show{display:flex}

.phone-modal{
  position:relative;
  width:min(88vw, 430px);
  aspect-ratio:1080/1920;
  animation:popIn .18s ease-out;
}
@keyframes popIn{
  from{transform:scale(.95); opacity:.6}
  to{transform:scale(1); opacity:1}
}

.phone-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
}
.phone-btn{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:none;
  padding:0;
}
.phone-btn img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.phone-btn .label{
  position:absolute;
  font-weight:900;
  font-size:15px;
  color:#294063;
  text-shadow:0 1px 0 rgba(255,255,255,.72);
}
.phone-btn:active{transform:scale(.98)}

.btn-tl{left:10%; top:51%; width:26%; height:12%}
.btn-tr{right:10%; top:51%; width:26%; height:12%}
.btn-bl{left:10%; top:70%; width:26%; height:12%}
.btn-br{right:10%; top:70%; width:26%; height:12%}
.btn-crown{
  left:50%; top:60%;
  transform:translateX(-50%);
  width:28%; height:16%;
}
.btn-crown:active{transform:translateX(-50%) scale(.98)}
.btn-crown .label{
  top:47%;
  transform:translateY(-50%);
  color:#6f5320;
  font-size:16px;
}
.crown-glow{
  animation:crownPulse 1.7s ease-in-out infinite alternate;
}
@keyframes crownPulse{
  from{opacity:.55; transform:translateX(-50%) scale(.96)}
  to{opacity:1; transform:translateX(-50%) scale(1.03)}
}

.close-btn{
  position:absolute;
  right:5.5%;
  top:3.7%;
  width:12%;
  height:8%;
  border:0;
  background:none;
  padding:0;
}
.close-btn img{
  width:100%;
  height:100%;
  object-fit:contain;
}
.close-btn:active{transform:scale(.96)}

.uishiyu-wrap{
  position:absolute;
  left:50%;
  top:13%;
  transform:translateX(-50%);
  width:54%;
  aspect-ratio:1/1;
}
.uishiyu-wrap .layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}
.uishiyu-sprite{
  position:absolute;
  left:50%;
  bottom:8%;
  transform:translateX(-50%);
  width:54%;
  aspect-ratio:800/1000;
}
.uishiyu-sprite .layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}

.games-panel{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(78vw, 340px);
  background:rgba(250,252,255,.96);
  border:3px solid white;
  border-radius:24px;
  box-shadow:0 12px 28px rgba(18,25,45,.2);
  padding:18px 16px 16px;
  display:none;
  z-index:60;
}
.games-panel.show{display:block}
.games-title{
  text-align:center;
  font-size:24px;
  font-weight:900;
  color:#ff5a9a;
  margin-bottom:14px;
}
.games-btn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:13px 14px;
  margin-bottom:10px;
  font:inherit;
  font-weight:900;
  color:#32476f;
  background:#dce6fb;
  box-shadow:0 5px 14px rgba(70,85,130,.12);
}
.games-btn.secondary{background:#f0dce5}
.games-btn:active{transform:scale(.99)}

.note-toast{
  position:absolute;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  z-index:70;
  background:rgba(255,255,255,.94);
  border:3px solid white;
  border-radius:18px;
  box-shadow:0 6px 18px var(--shadow);
  padding:10px 14px;
  font-size:14px;
  font-weight:900;
  color:#7a4d68;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.note-toast.show{opacity:1}

@media(max-width:700px){
  .window-layer{
    width:min(22vw, 180px);
    top:15%;
  }
  #shiyuRoom{
    width:min(26vw, 165px);
    left:6%;
  }
  #yukineRoom{
    width:min(28vw, 185px);
    right:5%;
  }
  .logo-box{font-size:14px}
  .phone-launch span{font-size:12px}
}
</style>
</head>
<body>
<div id="app">
  <img class="room-bg" src="images/room-bg.png" alt="Yukine's room background">
  <img class="window-layer" id="windowView" src="images/win-day.png" alt="Window view">

  <div class="top-ui">
    <div class="logo-box">Love &amp; Sweets</div>
    <div class="coins-box">
      <img src="images/heart-coin.png" alt="Heart Coin">
      <span id="coinCount">0</span>
    </div>
  </div>

  <div class="char" id="shiyuRoom">
    <img src="images/shiyu-base.png" alt="Shiyu base">
    <img id="shiyuRoomFace" src="images/shiyu-neutral.png" alt="Shiyu expression">
  </div>

  <div class="char" id="yukineRoom">
    <img src="images/yukine-base.png" alt="Yukine base">
    <img id="yukineRoomFace" src="images/yukine-neutral.png" alt="Yukine expression">
  </div>

  <button class="phone-launch" id="phoneOpenBtn" aria-label="Open phone">
    <div class="icon-wrap">
      <img src="images/phone-icon.png" alt="Phone icon">
      <span>PHONE</span>
    </div>
  </button>

  <div class="overlay" id="phoneOverlay">
    <div class="phone-modal">
      <img class="phone-layer" src="images/phone-base.png" alt="Phone UI">

      <div class="uishiyu-wrap">
        <img class="layer" src="images/uishiyu-bg.png" alt="Shiyu phone background">
        <div class="uishiyu-sprite">
          <img class="layer" src="images/uishiyu-base.png" alt="Shiyu phone base">
          <img class="layer" id="uiShiyuFace" src="images/uishiyu-neutral.png" alt="Shiyu phone expression">
        </div>
        <img class="layer" src="images/uishiyu-border.png" alt="Shiyu phone border">
        <img class="layer" src="images/uishiyu-bubble.png" alt="Shiyu speech bubble">
      </div>

      <button class="close-btn" id="phoneCloseBtn" aria-label="Close phone">
        <img src="images/phone-close.png" alt="Close">
      </button>

      <button class="phone-btn btn-tl" id="btnInventory">
        <img src="images/phone-tl.png" alt="">
        <span class="label">Inventory</span>
      </button>

      <button class="phone-btn btn-tr" id="btnShop">
        <img src="images/phone-tr.png" alt="">
        <span class="label">Shop</span>
      </button>

      <button class="phone-btn btn-bl" id="btnGames">
        <img src="images/phone-bl.png" alt="">
        <span class="label">Games</span>
      </button>

      <button class="phone-btn btn-br" id="btnStatus">
        <img src="images/phone-br.png" alt="">
        <span class="label">Status</span>
      </button>

      <button class="phone-btn btn-crown" id="btnDate">
        <img class="phone-layer crown-glow" src="images/phone-crown-glow.png" alt="">
        <img src="images/phone-crown.png" alt="">
        <span class="label">Date</span>
      </button>

      <div class="games-panel" id="gamesPanel">
        <div class="games-title">♡ Games ♡</div>
        <button class="games-btn" id="goBakery">Bakery Merge</button>
        <button class="games-btn secondary" id="goCrane">Crane Machine — Coming Soon</button>
        <button class="games-btn secondary" id="closeGames">← Back</button>
      </div>
    </div>
  </div>

  <div class="note-toast" id="toast"></div>
</div>

<script>
const windowView=document.getElementById("windowView");
const coinCount=document.getElementById("coinCount");
const phoneOpenBtn=document.getElementById("phoneOpenBtn");
const phoneOverlay=document.getElementById("phoneOverlay");
const phoneCloseBtn=document.getElementById("phoneCloseBtn");
const uiShiyuFace=document.getElementById("uiShiyuFace");
const shiyuRoomFace=document.getElementById("shiyuRoomFace");
const yukineRoomFace=document.getElementById("yukineRoomFace");
const btnInventory=document.getElementById("btnInventory");
const btnShop=document.getElementById("btnShop");
const btnGames=document.getElementById("btnGames");
const btnStatus=document.getElementById("btnStatus");
const btnDate=document.getElementById("btnDate");
const gamesPanel=document.getElementById("gamesPanel");
const goBakery=document.getElementById("goBakery");
const goCrane=document.getElementById("goCrane");
const closeGames=document.getElementById("closeGames");
const toast=document.getElementById("toast");

function updateCoins(){
  coinCount.textContent = localStorage.getItem("loveAndSweetsCoins") || "0";
}

function syncBakeryCoins(){
  const bakeryState=localStorage.getItem("loveAndSweetsBakeryV1");
  if(!bakeryState) return;
  try{
    const data=JSON.parse(bakeryState);
    if(data && typeof data.coins==="number"){
      localStorage.setItem("loveAndSweetsCoins", String(data.coins));
    }
  }catch(e){}
}

function chooseWindow(){
  const hour=new Date().getHours();
  if(hour>=7 && hour<17){
    windowView.src="images/win-day.png";
  }else if(hour>=17 && hour<20){
    windowView.src="images/win-sunset.png";
  }else{
    windowView.src="images/win-night.png";
  }
}

function showToast(text){
  toast.textContent=text;
  toast.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>toast.classList.remove("show"),1500);
}

function openPhone(){
  phoneOverlay.classList.add("show");
  gamesPanel.classList.remove("show");
  uiShiyuFace.src="images/uishiyu-happy.png";
  shiyuRoomFace.src="images/shiyu-happy.png";
}
function closePhone(){
  phoneOverlay.classList.remove("show");
  gamesPanel.classList.remove("show");
  uiShiyuFace.src="images/uishiyu-neutral.png";
  shiyuRoomFace.src="images/shiyu-neutral.png";
}

phoneOpenBtn.addEventListener("click",openPhone);
phoneCloseBtn.addEventListener("click",closePhone);

btnGames.addEventListener("click",()=>{
  gamesPanel.classList.add("show");
  uiShiyuFace.src="images/uishiyu-happy.png";
});
closeGames.addEventListener("click",()=>{
  gamesPanel.classList.remove("show");
});

btnInventory.addEventListener("click",()=>showToast("Inventory coming soon ♡"));
btnShop.addEventListener("click",()=>showToast("Shop coming soon ♡"));
btnStatus.addEventListener("click",()=>showToast("Status coming soon ♡"));
btnDate.addEventListener("click",()=>showToast("Dates coming soon ♡"));
goCrane.addEventListener("click",()=>showToast("Crane Machine coming soon ♡"));

goBakery.addEventListener("click",()=>{
  window.location.href="bakery/";
});

phoneOverlay.addEventListener("click",(e)=>{
  if(e.target===phoneOverlay) closePhone();
});

chooseWindow();
syncBakeryCoins();
updateCoins();

/* Small idle expression flavor */
setInterval(()=>{
  if(phoneOverlay.classList.contains("show")) return;
  const r=Math.random();
  if(r<0.15){
    yukineRoomFace.src="images/yukine-happy.png";
    shiyuRoomFace.src="images/shiyu-happy.png";
  }else if(r<0.22){
    yukineRoomFace.src="images/yukine-shocked.png";
    shiyuRoomFace.src="images/shiyu-angry.png";
  }else{
    yukineRoomFace.src="images/yukine-neutral.png";
    shiyuRoomFace.src="images/shiyu-neutral.png";
  }
}, 6000);
</script>
</body>
</html>
