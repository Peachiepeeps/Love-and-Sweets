<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Love & Sweets</title>
<style>
:root{
  --ink:#27314a;
  --shadow:rgba(25,35,65,.18);
  --pink:#ff5a9a;
  --panel:rgba(255,255,255,.78);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:var(--ink);
  background:#dfe6f4;
}
body{
  min-height:100vh;
  margin:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#202536;
}

#app{
  position:relative;
  width:min(100vw, calc(100vh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  aspect-ratio:16 / 9;
  overflow:hidden;
  background:#dfe6f4;
}

.room-stage{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.room-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  user-select:none;
  pointer-events:none;
}

.rotate-screen{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#eef2f7;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.rotate-card{
  background:rgba(255,255,255,.92);
  border:3px solid white;
  border-radius:26px;
  box-shadow:0 12px 30px rgba(35,45,70,.18);
  padding:24px 28px;
  color:#536797;
  font-weight:900;
  font-size:20px;
  line-height:1.4;
}

.rotate-phone{
  display:block;
  font-size:48px;
  margin-bottom:10px;
  animation:rotateHint 1.8s ease-in-out infinite alternate;
}

@keyframes rotateHint{
  from{transform:rotate(0deg)}
  to{transform:rotate(90deg)}
}

@media (orientation:portrait){
  #app{display:none}
  .rotate-screen{display:flex}
}


.character-hotspot{
  position:absolute;
  z-index:18;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.character-hotspot:active{
  transform:scale(.995);
}

.shiyu-hotspot{
  left:24%;
  top:54%;
  width:25%;
  height:45%;
}

.yukine-hotspot{
  left:54%;
  top:36%;
  width:23%;
  height:63%;
}

.top-ui{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:flex-end;
  align-items:flex-start;
  z-index:20;
  pointer-events:none;
}
.coins-box{
  background:var(--panel);
  border:3px solid white;
  border-radius:18px;
  box-shadow:0 5px 16px var(--shadow);
  padding:10px 14px;
  pointer-events:auto;
}
.coins-box{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:900;
}
.coins-box img{
  width:24px;
  height:24px;
  object-fit:contain;
}

.phone-hotspot{
  position:absolute;
  left:1.2%;
  top:1.8%;
  width:13.5%;
  height:22%;
  z-index:25;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.phone-hotspot:active{transform:scale(.96)}

.phone-label{
  position:absolute;
  left:7.2%;
  top:4.1%;
  transform:translateX(-50%);
  z-index:24;
  font-weight:900;
  font-size:clamp(10px,1.15vw,18px);
  color:white;
  letter-spacing:.8px;
  text-shadow:0 2px 4px rgba(0,0,0,.35);
  pointer-events:none;
}

.overlay{
  position:absolute;
  inset:0;
  background:rgba(22,29,49,.42);
  backdrop-filter:blur(2px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:40;
  padding:14px;
}
.overlay.show{display:flex}

.phone-modal{
  position:relative;
  width:min(96vw, 1100px);
  height:auto;
  aspect-ratio:16 / 9;
  animation:popIn .18s ease-out;
}
@keyframes popIn{
  from{transform:scale(.95); opacity:.6}
  to{transform:scale(1); opacity:1}
}
.phone-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
}
.phone-art{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
  user-select:none;
}

.phone-hot{
  position:absolute;
  z-index:15;
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.phone-hot:active{
  transform:scale(.97);
}

.phone-text{
  position:absolute;
  z-index:16;
  transform:translate(-50%,-50%);
  font-weight:900;
  font-size:clamp(10px,1.15vw,17px);
  color:#294063;
  text-shadow:0 1px 0 rgba(255,255,255,.75);
  pointer-events:none;
  text-align:center;
  white-space:nowrap;
}

.label-tl{left:41.3%; top:55.7%}
.label-tr{left:62.7%; top:55.7%}
.label-bl{left:41.3%; top:84.3%}
.label-br{left:62.7%; top:84.3%}
.label-date{
  left:52%;
  top:72%;
  color:#6f5320;
}

.hot-tl{left:36.5%; top:53.5%; width:10%; height:11%}
.hot-tr{left:57.7%; top:53.5%; width:10%; height:11%}
.hot-bl{left:36.5%; top:78.5%; width:10%; height:11%}
.hot-br{left:57.7%; top:78.5%; width:10%; height:11%}
.hot-date{left:45%; top:63%; width:14%; height:19%}
.hot-close{left:67.5%; top:1.5%; width:6.5%; height:10%}

.crown-glow{
  animation:crownPulse 1.7s ease-in-out infinite alternate;
}
@keyframes crownPulse{
  from{opacity:.52}
  to{opacity:1}
}

.games-panel{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(78vw, 340px);
  background:rgba(250,252,255,.96);
  border:3px solid white;
  border-radius:24px;
  box-shadow:0 12px 28px rgba(18,25,45,.2);
  padding:18px 16px 16px;
  display:none;
  z-index:60;
}
.games-panel.show{display:block}
.games-title{
  text-align:center;
  font-size:24px;
  font-weight:900;
  color:#ff5a9a;
  margin-bottom:14px;
}
.games-btn{
  width:100%;
  border:0;
  border-radius:18px;
  padding:13px 14px;
  margin-bottom:10px;
  font:inherit;
  font-weight:900;
  color:#32476f;
  background:#dce6fb;
  box-shadow:0 5px 14px rgba(70,85,130,.12);
}
.games-btn.secondary{background:#f0dce5}
.games-btn:active{transform:scale(.99)}

.note-toast{
  position:absolute;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  z-index:70;
  background:rgba(255,255,255,.94);
  border:3px solid white;
  border-radius:18px;
  box-shadow:0 6px 18px var(--shadow);
  padding:10px 14px;
  font-size:14px;
  font-weight:900;
  color:#7a4d68;
  opacity:0;
  pointer-events:none;
  transition:opacity .18s ease;
}
.note-toast.show{opacity:1}



/* ===== MOBILE LANDSCAPE: FULL SCENE, NO CROP ===== */




/* ===== MOBILE LANDSCAPE: FULLSCREEN, NO STRETCH ===== */
@media (max-width:950px) and (orientation:landscape){

  html,
  body{
    position:fixed !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    margin:0 !important;
    padding:0 !important;
    overflow:hidden !important;
    background:#eef2f7 !important;
  }

  body{
    display:block !important;
  }

  #app{
    position:fixed !important;
    inset:0 !important;
    width:100vw !important;
    height:100dvh !important;
    max-width:none !important;
    max-height:none !important;
    aspect-ratio:auto !important;
    margin:0 !important;
    padding:0 !important;
    overflow:hidden !important;
    background:#eef2f7 !important;
  }

  .room-stage{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    overflow:hidden !important;
  }

  /* Preserve the actual 1920×1080 art proportions.
     Wide phone screens crop a little from the TOP, keeping feet visible. */
  .room-layer:not(.phone-room-layer){
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    object-fit:cover !important;
    object-position:center bottom !important;
  }

  /* The phone launcher is UI, so keep its entire full-canvas placement
     instead of letting the top crop cut it off. */
  .phone-room-layer{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    object-fit:fill !important;
  }

  .top-ui{
    top:max(6px,env(safe-area-inset-top)) !important;
    left:max(6px,env(safe-area-inset-left)) !important;
    right:max(6px,env(safe-area-inset-right)) !important;
  }

  .coins-box{
    padding:6px 9px !important;
    border-radius:13px !important;
    font-size:11px !important;
  }

  .coins-box img{
    width:18px !important;
    height:18px !important;
  }

  /* Keep the phone popup behavior from v9. */
  .phone-modal{
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    max-width:none !important;
    max-height:none !important;
    aspect-ratio:auto !important;
  }

  .phone-art{
    width:100% !important;
    height:100% !important;
    object-fit:fill !important;
  }

  .phone-text{
    font-size:clamp(10px,1.8vw,15px) !important;
  }

  .hot-close{
    left:64.5% !important;
    top:1.2% !important;
    width:7% !important;
    height:11% !important;
    z-index:30 !important;
  }
}

</style>
</head>
<body>

<div class="rotate-screen">
  <div class="rotate-card">
    <span class="rotate-phone">📱</span>
    Rotate your device sideways ♡<br>
    Love &amp; Sweets is best played in landscape!
  </div>
</div>

<div id="app">
  <div class="room-stage">
    <img class="room-layer" src="images/room-bg.png" alt="Yukine's room background">
    <img class="room-layer" id="windowView" src="images/win-day.png" alt="Window view">
    <img class="room-layer" src="images/shiyu-base.png" alt="Shiyu base">
    <img class="room-layer" id="shiyuRoomFace" src="images/shiyu-neutral.png" alt="Shiyu expression">
    <img class="room-layer" src="images/yukine-base.png" alt="Yukine base">
    <img class="room-layer" id="yukineRoomFace" src="images/yukine-neutral.png" alt="Yukine expression">
    <img class="room-layer phone-room-layer" src="images/phone-icon.png" alt="">
  </div>

  <button class="character-hotspot shiyu-hotspot" id="shiyuTap" aria-label="Tap Shiyu"></button>
  <button class="character-hotspot yukine-hotspot" id="yukineTap" aria-label="Tap Yukine"></button>

  <div class="top-ui">
    <div class="coins-box">
      <img src="images/heart-coin.png" alt="Heart Coin">
      <span id="coinCount">0</span>
    </div>
  </div>

  <button class="phone-hotspot" id="phoneOpenBtn" aria-label="Open phone"></button>
  <div class="phone-label">PHONE</div>

  <div class="overlay" id="phoneOverlay">
    <div class="phone-modal">
      <img class="phone-art" src="images/phone-base.png" alt="Phone UI">
      <img class="phone-art" src="images/uishiyu-bg.png" alt="">
      <img class="phone-art" src="images/uishiyu-base.png" alt="Shiyu">
      <img class="phone-art" id="uiShiyuFace" src="images/uishiyu-neutral.png" alt="">
      <img class="phone-art" src="images/uishiyu-border.png" alt="">
      <img class="phone-art" src="images/uishiyu-bubble.png" alt="">

      <img class="phone-art" src="images/phone-tl.png" alt="">
      <img class="phone-art" src="images/phone-tr.png" alt="">
      <img class="phone-art" src="images/phone-bl.png" alt="">
      <img class="phone-art" src="images/phone-br.png" alt="">
      <img class="phone-art crown-glow" src="images/phone-crown-glow.png" alt="">
      <img class="phone-art" src="images/phone-crown.png" alt="">
      <img class="phone-art" src="images/phone-close.png" alt="">

      <button class="phone-hot hot-tl" id="btnInventory" aria-label="Inventory"></button>
      <button class="phone-hot hot-tr" id="btnShop" aria-label="Shop"></button>
      <button class="phone-hot hot-bl" id="btnGames" aria-label="Games"></button>
      <button class="phone-hot hot-br" id="btnStatus" aria-label="Status"></button>
      <button class="phone-hot hot-date" id="btnDate" aria-label="Date"></button>
      <button class="phone-hot hot-close" id="phoneCloseBtn" aria-label="Close phone"></button>

      <div class="phone-text label-tl">Inventory</div>
      <div class="phone-text label-tr">Shop</div>
      <div class="phone-text label-bl">Games</div>
      <div class="phone-text label-br">Status</div>
      <div class="phone-text label-date">Date</div>

      <div class="games-panel" id="gamesPanel">
        <div class="games-title">♡ Games ♡</div>
        <button class="games-btn" id="goBakery">Bakery Merge</button>
        <button class="games-btn secondary" id="goCrane">Crane Machine — Coming Soon</button>
        <button class="games-btn secondary" id="closeGames">← Back</button>
      </div>
    </div>
  </div>

  <div class="note-toast" id="toast"></div>
</div>

<script>
const windowView=document.getElementById("windowView");
const coinCount=document.getElementById("coinCount");
const phoneOpenBtn=document.getElementById("phoneOpenBtn");
const phoneOverlay=document.getElementById("phoneOverlay");
const phoneCloseBtn=document.getElementById("phoneCloseBtn");
const uiShiyuFace=document.getElementById("uiShiyuFace");
const shiyuRoomFace=document.getElementById("shiyuRoomFace");
const yukineRoomFace=document.getElementById("yukineRoomFace");
const shiyuTap=document.getElementById("shiyuTap");
const yukineTap=document.getElementById("yukineTap");
const btnInventory=document.getElementById("btnInventory");
const btnShop=document.getElementById("btnShop");
const btnGames=document.getElementById("btnGames");
const btnStatus=document.getElementById("btnStatus");
const btnDate=document.getElementById("btnDate");
const gamesPanel=document.getElementById("gamesPanel");
const goBakery=document.getElementById("goBakery");
const goCrane=document.getElementById("goCrane");
const closeGames=document.getElementById("closeGames");
const toast=document.getElementById("toast");

function updateCoins(){
  coinCount.textContent = localStorage.getItem("loveAndSweetsCoins") || "0";
}
function syncBakeryCoins(){
  const bakeryState=localStorage.getItem("loveAndSweetsBakeryV1");
  if(!bakeryState) return;
  try{
    const data=JSON.parse(bakeryState);
    if(data && typeof data.coins==="number"){
      localStorage.setItem("loveAndSweetsCoins", String(data.coins));
    }
  }catch(e){}
}
function chooseWindow(){
  const hour=new Date().getHours();
  if(hour>=7 && hour<17){
    windowView.src="images/win-day.png";
  }else if(hour>=17 && hour<20){
    windowView.src="images/win-sunset.png";
  }else{
    windowView.src="images/win-night.png";
  }
}
function showToast(text){
  toast.textContent=text;
  toast.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>toast.classList.remove("show"),1500);
}
function openPhone(){
  phoneOverlay.classList.add("show");
  gamesPanel.classList.remove("show");
}
function closePhone(){
  phoneOverlay.classList.remove("show");
  gamesPanel.classList.remove("show");
}

/* Character tap reactions
   - normal tap: happy/blushing for 1.5 seconds
   - 5 quick taps: Shiyu gets angry / Yukine gets shocked
   - streak resets if you leave them alone for 3 seconds
*/
const tapReactions={
  shiyu:{
    count:0,
    locked:false,
    streakTimer:null,
    faceTimer:null,
    face:shiyuRoomFace,
    happy:"images/shiyu-happy.png",
    annoyed:"images/shiyu-angry.png",
    neutral:"images/shiyu-neutral.png"
  },
  yukine:{
    count:0,
    locked:false,
    streakTimer:null,
    faceTimer:null,
    face:yukineRoomFace,
    happy:"images/yukine-happy.png",
    annoyed:"images/yukine-shocked.png",
    neutral:"images/yukine-neutral.png"
  }
};

function reactToTap(character){
  const data=tapReactions[character];

  /* While angry/shocked is active, ignore extra taps. */
  if(data.locked) return;

  data.count++;

  clearTimeout(data.streakTimer);
  clearTimeout(data.faceTimer);

  if(data.count>=5){
    data.locked=true;
    data.face.src=data.annoyed;
    data.count=0;

    data.faceTimer=setTimeout(()=>{
      data.face.src=data.neutral;
      data.locked=false;
    },3000);
  }else{
    data.face.src=data.happy;

    data.faceTimer=setTimeout(()=>{
      data.face.src=data.neutral;
    },1500);
  }

  data.streakTimer=setTimeout(()=>{
    data.count=0;
  },3000);
}

shiyuTap.addEventListener("click",()=>reactToTap("shiyu"));
yukineTap.addEventListener("click",()=>reactToTap("yukine"));


phoneOpenBtn.addEventListener("click",openPhone);
phoneCloseBtn.addEventListener("click",closePhone);

btnGames.addEventListener("click",()=>{
  gamesPanel.classList.add("show");
});
closeGames.addEventListener("click",()=>gamesPanel.classList.remove("show"));
btnInventory.addEventListener("click",()=>showToast("Inventory coming soon ♡"));
btnShop.addEventListener("click",()=>showToast("Shop coming soon ♡"));
btnStatus.addEventListener("click",()=>showToast("Status coming soon ♡"));
btnDate.addEventListener("click",()=>showToast("Dates coming soon ♡"));
goCrane.addEventListener("click",()=>showToast("Crane Machine coming soon ♡"));
goBakery.addEventListener("click",()=>{ window.location.href="bakery/"; });

phoneOverlay.addEventListener("click",(e)=>{
  if(e.target===phoneOverlay) closePhone();
});

chooseWindow();
syncBakeryCoins();
updateCoins();

</script>
</body>
</html>
