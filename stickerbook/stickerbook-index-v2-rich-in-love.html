<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>♡ Love & Sweets Stickerbook ♡</title>

<style>
:root{
  --ink:#7c5871;
  --panel:#fffaf4;
  --pink:#efb1c4;
  --lav:#c9b7e8;
  --blue:#b8d9ef;
  --green:#bdd1ac;
  --paper:#fff8ec;
}

*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  background-image:url("../images/background.png");
  background-repeat:repeat;
  background-size:100px auto;
  background-position:top left;
}

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 250px;
  gap:14px;
  padding:14px;
}

.main{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
}

.topbar{
  width:min(100%,720px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.title{
  font-size:clamp(24px,4vw,36px);
  font-weight:900;
  color:#d7789a;
  text-shadow:0 2px 0 white,0 4px 12px rgba(130,70,100,.16);
}

.top-actions{
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

button{
  border:0;
  border-radius:16px;
  padding:10px 13px;
  font:inherit;
  font-weight:900;
  color:#765569;
  background:#fffaf4;
  box-shadow:0 4px 12px rgba(100,60,80,.14);
  touch-action:manipulation;
  cursor:pointer;
}

button:active{transform:scale(.98)}
button:disabled{opacity:.42;cursor:default}

.theme-picker{
  display:flex;
  gap:6px;
  align-items:center;
}

.theme-dot{
  width:30px;
  height:30px;
  padding:0;
  border:3px solid rgba(255,255,255,.95);
  outline:2px solid transparent;
  border-radius:50%;
}
.theme-dot.active{outline-color:#8b6679}
.theme-dot[data-theme="pink"]{background:var(--pink)}
.theme-dot[data-theme="lavender"]{background:var(--lav)}
.theme-dot[data-theme="blue"]{background:var(--blue)}
.theme-dot[data-theme="green"]{background:var(--green)}

.book-shell{
  position:relative;
  width:min(72vh,620px,92vw);
  aspect-ratio:4 / 5;
  perspective:1700px;
  transform-style:preserve-3d;
  user-select:none;
  -webkit-user-select:none;
}

.book-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.shadow-layer{z-index:0; transform:translateY(2.2%) scale(1.01)}
.base-layer{z-index:1}
.page-under{z-index:2}

.flip-stage{
  position:absolute;
  inset:0;
  z-index:5;
  transform-origin:50% 16%;
  transform-style:preserve-3d;
  will-change:transform,filter,opacity;
}

.flip-stage.flipping-next{
  animation:flipUp .82s cubic-bezier(.22,.7,.22,1) forwards;
}

.flip-stage.flipping-prev{
  animation:flipDown .72s cubic-bezier(.22,.7,.22,1) forwards;
}

@keyframes flipUp{
  0%{
    transform:perspective(1500px) rotateX(0deg) translateY(0);
    filter:brightness(1);
    opacity:1;
  }
  35%{
    transform:perspective(1500px) rotateX(-68deg) translateY(-1.5%);
    filter:brightness(.9);
    opacity:1;
  }
  75%{
    transform:perspective(1500px) rotateX(-145deg) translateY(-7%);
    filter:brightness(.72);
    opacity:.86;
  }
  100%{
    transform:perspective(1500px) rotateX(-180deg) translateY(-9%);
    filter:brightness(.62);
    opacity:0;
  }
}

@keyframes flipDown{
  0%{
    transform:perspective(1500px) rotateX(-180deg) translateY(-9%);
    filter:brightness(.62);
    opacity:0;
  }
  35%{
    transform:perspective(1500px) rotateX(-125deg) translateY(-5%);
    filter:brightness(.76);
    opacity:.72;
  }
  72%{
    transform:perspective(1500px) rotateX(-45deg) translateY(-1%);
    filter:brightness(.92);
    opacity:1;
  }
  100%{
    transform:perspective(1500px) rotateX(0deg) translateY(0);
    filter:brightness(1);
    opacity:1;
  }
}

.page-image{z-index:1}

.page-stickers{
  position:absolute;
  left:10.8%;
  top:22.2%;
  width:78.4%;
  height:61.8%;
  z-index:4;
  overflow:visible;
  touch-action:none;
}

.placed-sticker{
  position:absolute;
  width:18%;
  max-width:150px;
  min-width:44px;
  transform:translate(-50%,-50%);
  transform-origin:center;
  touch-action:none;
  cursor:grab;
  user-select:none;
  -webkit-user-drag:none;
  filter:drop-shadow(0 3px 3px rgba(65,40,55,.14));
}
.placed-sticker:active{cursor:grabbing}

.spiral-layer{
  z-index:20;
  pointer-events:none;
}

.page-shadow-moving{
  position:absolute;
  left:11%;
  top:20%;
  width:78%;
  height:8%;
  border-radius:50%;
  background:rgba(70,48,58,.12);
  filter:blur(15px);
  z-index:4;
  opacity:0;
  pointer-events:none;
}
.book-shell.turning .page-shadow-moving{
  animation:turnShadow .82s ease forwards;
}
@keyframes turnShadow{
  0%{opacity:0;transform:translateY(20px) scaleY(.35)}
  38%{opacity:.55;transform:translateY(-6px) scaleY(1)}
  100%{opacity:0;transform:translateY(-42px) scaleY(.25)}
}

.page-controls{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:center;
  flex-wrap:wrap;
}
.page-number{
  min-width:90px;
  text-align:center;
  padding:8px 12px;
  border-radius:14px;
  background:rgba(255,250,244,.94);
  box-shadow:0 3px 10px rgba(100,60,80,.1);
  font-weight:900;
}

.hint{
  font-size:12px;
  font-weight:800;
  color:#9d738a;
  background:rgba(255,250,244,.9);
  padding:7px 11px;
  border-radius:13px;
  text-align:center;
}

.drawer{
  position:sticky;
  top:14px;
  align-self:start;
  width:250px;
  max-height:calc(100vh - 28px);
  background:rgba(255,250,244,.97);
  border:3px solid white;
  border-radius:22px;
  box-shadow:0 10px 28px rgba(90,50,75,.17);
  overflow:hidden;
  transition:width .25s ease,transform .25s ease;
}

.drawer.collapsed{
  width:58px;
}
.drawer.collapsed .drawer-body,
.drawer.collapsed .drawer-title span{
  display:none;
}

.drawer-head{
  min-height:54px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
  padding:8px;
  background:#fff5fb;
  border-bottom:2px solid #f0d7e4;
}
.drawer-title{
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
}
.drawer-toggle{
  min-width:40px;
  padding:9px;
}

.drawer-body{
  padding:10px;
  overflow:auto;
  max-height:calc(100vh - 86px);
}

.sticker-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.sticker-option{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  min-height:98px;
  padding:7px;
  border-radius:16px;
  background:#fff;
  border:2px solid #f2dbe5;
  cursor:grab;
  touch-action:none;
}
.sticker-option:active{cursor:grabbing}
.sticker-option img{
  width:72px;
  height:72px;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
}
.sticker-option span{
  font-size:10px;
  font-weight:900;
  text-align:center;
}

.drawer-note{
  margin-top:10px;
  font-size:10px;
  line-height:1.35;
  text-align:center;
  color:#9a7889;
}

.drag-ghost{
  position:fixed;
  width:82px;
  height:82px;
  object-fit:contain;
  pointer-events:none;
  transform:translate(-50%,-50%) scale(1.03);
  z-index:9999;
  filter:drop-shadow(0 8px 9px rgba(80,50,65,.22));
}

.home-link{
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 13px;
  border-radius:16px;
  background:#f3e9ff;
  color:#675577;
  font-weight:900;
  box-shadow:0 4px 12px rgba(90,60,100,.12);
}

@media(max-width:800px){
  .app{
    grid-template-columns:1fr;
    padding:9px;
    padding-bottom:92px;
  }
  .book-shell{
    width:min(80vh,94vw,600px);
  }
  .drawer{
    position:fixed;
    left:50%;
    bottom:8px;
    top:auto;
    transform:translateX(-50%);
    width:min(94vw,520px);
    max-height:42vh;
    z-index:500;
  }
  .drawer.collapsed{
    width:58px;
    left:auto;
    right:8px;
    transform:none;
  }
  .drawer-body{max-height:calc(42vh - 58px)}
  .sticker-grid{grid-template-columns:repeat(5,1fr)}
  .sticker-option{min-height:76px;padding:5px}
  .sticker-option img{width:54px;height:54px}
  .sticker-option span{display:none}
}

@media(max-width:520px){
  .title{width:100%;text-align:center}
  .topbar{justify-content:center}
  .book-shell{width:min(78vh,97vw)}
  .sticker-grid{grid-template-columns:repeat(3,1fr)}
}

.sticker-option.locked{
  position:relative;
  cursor:default;
  opacity:.58;
  filter:saturate(.45);
}
.sticker-option.locked::after{
  content:"🔒";
  position:absolute;
  top:6px;
  right:7px;
  width:25px;
  height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(255,250,244,.96);
  box-shadow:0 2px 7px rgba(80,50,65,.15);
  font-size:14px;
}
.sticker-lock-text{
  font-size:9px;
  line-height:1.15;
  font-weight:900;
  color:#8f7382;
  text-align:center;
}
.unlock-modal{
  position:fixed;
  inset:0;
  z-index:10000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(73,48,64,.28);
}
.unlock-modal.show{display:flex}
.unlock-card{
  width:min(92vw,360px);
  padding:22px 20px 18px;
  border-radius:26px;
  border:4px solid white;
  background:#fffaf4;
  box-shadow:0 18px 48px rgba(74,45,62,.25);
  text-align:center;
  animation:unlockPop .5s cubic-bezier(.22,.85,.32,1.15);
}
@keyframes unlockPop{
  from{transform:scale(.72);opacity:0}
  to{transform:scale(1);opacity:1}
}
.unlock-card h2{
  margin:0 0 8px;
  color:#d7789a;
  font-size:24px;
}
.unlock-card img{
  width:110px;
  height:110px;
  object-fit:contain;
  margin:4px auto 6px;
  display:block;
  filter:drop-shadow(0 5px 7px rgba(90,55,70,.18));
}
.unlock-card p{
  margin:6px 0 14px;
  font-size:13px;
  line-height:1.45;
  font-weight:800;
  color:#806174;
}
.unlock-card strong{color:#c86d91}

</style>
</head>

<body>
<div class="app">

  <main class="main">

    <div class="topbar">
      <div class="title">♡ Stickerbook ♡</div>

      <div class="top-actions">
        <div class="theme-picker" aria-label="Stickerbook theme">
          <button class="theme-dot" data-theme="pink" title="Pink"></button>
          <button class="theme-dot" data-theme="lavender" title="Lavender"></button>
          <button class="theme-dot" data-theme="blue" title="Blue"></button>
          <button class="theme-dot" data-theme="green" title="Green"></button>
        </div>
        <button id="clearPageBtn">Clear Page</button>
        <a class="home-link" href="../">← Home</a>
      </div>
    </div>

    <div class="book-shell" id="bookShell">
      <img class="book-layer shadow-layer" src="../images/stickerbook-shadow.png" alt="">
      <img class="book-layer base-layer" id="baseLayer" src="../images/book-pink-base.png" alt="">
      <img class="book-layer page-under" id="underPage" src="../images/book-pink-page.png" alt="">

      <div class="page-shadow-moving"></div>

      <div class="flip-stage" id="flipStage">
        <img class="book-layer page-image" id="pageImage" src="../images/book-pink-page.png" alt="Stickerbook page">
        <div class="page-stickers" id="pageStickers"></div>
      </div>

      <img class="book-layer spiral-layer" src="../images/stickerbook-spiral.png" alt="">
    </div>

    <div class="page-controls">
      <button id="prevBtn">← Previous</button>
      <div class="page-number" id="pageNumber">Page 1 / 8</div>
      <button id="nextBtn">Flip Up ↑</button>
    </div>

    <div class="hint">
      Drag stickers from the drawer onto the paper. Drag placed stickers to move them.
    </div>

  </main>

  <aside class="drawer" id="drawer">
    <div class="drawer-head">
      <div class="drawer-title">✨ <span>Stickers</span></div>
      <button class="drawer-toggle" id="drawerToggle" aria-label="Toggle sticker drawer">−</button>
    </div>

    <div class="drawer-body">
      <div class="sticker-grid" id="stickerGrid"></div>
      <div class="drawer-note">
        Each page remembers its own stickers automatically.
      </div>
    </div>
  </aside>

</div>

<script>
const PAGE_COUNT=8;
const SAVE_KEY="loveAndSweetsStickerbookV1";
const STICKER_UNLOCK_KEY="loveAndSweetsStickerUnlocksV1";
const SHARED_COIN_KEY="loveAndSweetsCoins";
const RICH_IN_LOVE_THRESHOLD=9999;

const THEMES={
  pink:{
    base:"../images/book-pink-base.png",
    page:"../images/book-pink-page.png"
  },
  lavender:{
    base:"../images/book-lavender-base.png",
    page:"../images/book-lavender-page.png"
  },
  blue:{
    base:"../images/book-blue-base.png",
    page:"../images/book-blue-page.png"
  },
  green:{
    base:"../images/book-green-base.png",
    page:"../images/book-green-page.png"
  }
};

const STICKERS=[
  {
    id:"coin",
    name:"Rich in Love",
    src:"../images/sticker-coin.png",
    unlock:"coin",
    lockedText:"Reach 9,999 Heart Coins"
  },
  {id:"couple",name:"Couple",src:"../images/sticker-couple.png"},
  {
    id:"blanket",
    name:"Blanket",
    src:"../images/sticker-blanket.png",
    unlock:"blanket",
    lockedText:"Special Memory"
  },
  {id:"sparkles",name:"Sparkles",src:"../images/sticker-sparkles.png"},
  {id:"heart",name:"Heart",src:"../images/sticker-heart.png"}
];

let state={
  theme:"pink",
  currentPage:0,
  pages:Array.from({length:PAGE_COUNT},()=>[])
};

let stickerUnlocks={
  coin:false,
  blanket:false
};

let turning=false;
let activeDrag=null;
let ghost=null;
let pointerMoved=false;

const baseLayer=document.getElementById("baseLayer");
const underPage=document.getElementById("underPage");
const pageImage=document.getElementById("pageImage");
const pageStickers=document.getElementById("pageStickers");
const flipStage=document.getElementById("flipStage");
const bookShell=document.getElementById("bookShell");
const pageNumber=document.getElementById("pageNumber");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const clearPageBtn=document.getElementById("clearPageBtn");
const drawer=document.getElementById("drawer");
const drawerToggle=document.getElementById("drawerToggle");
const stickerGrid=document.getElementById("stickerGrid");
const unlockModal=document.getElementById("unlockModal");
const unlockStickerImage=document.getElementById("unlockStickerImage");
const unlockStickerText=document.getElementById("unlockStickerText");
const unlockModalBtn=document.getElementById("unlockModalBtn");


function loadStickerUnlocks(){
  try{
    const saved=JSON.parse(localStorage.getItem(STICKER_UNLOCK_KEY));
    if(saved && typeof saved==="object"){
      stickerUnlocks.coin=Boolean(saved.coin);
      stickerUnlocks.blanket=Boolean(saved.blanket);
    }
  }catch(e){}
}

function saveStickerUnlocks(){
  localStorage.setItem(STICKER_UNLOCK_KEY,JSON.stringify(stickerUnlocks));
}

function isStickerUnlocked(def){
  if(!def.unlock) return true;
  return Boolean(stickerUnlocks[def.unlock]);
}

function getSharedCoinBalance(){
  let shared=0;
  let bakery=0;

  const direct=Number(localStorage.getItem(SHARED_COIN_KEY));
  if(Number.isFinite(direct)) shared=direct;

  try{
    const savedBakery=JSON.parse(localStorage.getItem("loveAndSweetsBakeryV1"));
    if(savedBakery && Number.isFinite(Number(savedBakery.coins))){
      bakery=Number(savedBakery.coins);
    }
  }catch(e){}

  return Math.max(shared,bakery);
}

function showRichInLovePopup(){
  unlockStickerImage.src="../images/sticker-coin.png";
  unlockStickerImage.alt="Rich in Love Sticker";
  unlockStickerText.innerHTML=
    `You reached <strong>${RICH_IN_LOVE_THRESHOLD.toLocaleString()} Heart Coins!</strong><br>`+
    `You earned the <strong>Rich in Love</strong> Sticker!`;

  unlockModal.classList.add("show");
  unlockModal.setAttribute("aria-hidden","false");
}

function closeUnlockPopup(){
  unlockModal.classList.remove("show");
  unlockModal.setAttribute("aria-hidden","true");
}

function checkRichInLoveUnlock(){
  if(stickerUnlocks.coin) return false;
  if(getSharedCoinBalance()<RICH_IN_LOVE_THRESHOLD) return false;

  stickerUnlocks.coin=true;
  saveStickerUnlocks();
  renderStickerDrawer();
  showRichInLovePopup();
  return true;
}

function save(){
  localStorage.setItem(SAVE_KEY,JSON.stringify(state));
}

function load(){
  try{
    const saved=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(saved && typeof saved==="object"){
      if(THEMES[saved.theme]) state.theme=saved.theme;
      if(Number.isInteger(saved.currentPage)){
        state.currentPage=Math.max(0,Math.min(PAGE_COUNT-1,saved.currentPage));
      }
      if(Array.isArray(saved.pages)){
        const pages=Array.from({length:PAGE_COUNT},(_,i)=>
          Array.isArray(saved.pages[i])
            ? saved.pages[i].map(sticker=>{
                if(sticker && sticker.type==="wallet"){
                  return {...sticker,type:"blanket"};
                }
                return sticker;
              })
            : []
        );
        state.pages=pages;
      }
    }
  }catch(e){}
}

function setTheme(theme){
  if(!THEMES[theme]) return;
  state.theme=theme;

  const config=THEMES[theme];
  baseLayer.src=config.base;
  underPage.src=config.page;
  pageImage.src=config.page;

  document.querySelectorAll(".theme-dot").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.theme===theme);
  });

  save();
}

function renderPage(){
  const stickers=state.pages[state.currentPage]||[];
  pageStickers.innerHTML="";

  stickers.forEach(sticker=>{
    const def=STICKERS.find(s=>s.id===sticker.type);
    if(!def) return;

    const img=document.createElement("img");
    img.className="placed-sticker";
    img.src=def.src;
    img.alt=def.name;
    img.dataset.instance=sticker.instance;
    img.style.left=(sticker.x*100)+"%";
    img.style.top=(sticker.y*100)+"%";
    img.style.width=(sticker.scale||.18)*100+"%";
    img.style.transform=`translate(-50%,-50%) rotate(${sticker.rotation||0}deg)`;

    img.addEventListener("pointerdown",e=>{
      beginPlacedDrag(e,sticker.instance);
    });

    pageStickers.appendChild(img);
  });

  pageNumber.textContent=`Page ${state.currentPage+1} / ${PAGE_COUNT}`;
  prevBtn.disabled=state.currentPage===0 || turning;
  nextBtn.disabled=state.currentPage===PAGE_COUNT-1 || turning;
}

function renderStickerDrawer(){
  stickerGrid.innerHTML="";

  STICKERS.forEach(def=>{
    const unlocked=isStickerUnlocked(def);

    const tile=document.createElement("div");
    tile.className="sticker-option"+(unlocked ? "" : " locked");
    tile.dataset.sticker=def.id;

    const img=document.createElement("img");
    img.src=def.src;
    img.alt=def.name;

    const label=document.createElement("span");
    label.textContent=def.name;

    tile.appendChild(img);
    tile.appendChild(label);

    if(unlocked){
      tile.addEventListener("pointerdown",e=>beginDrawerDrag(e,def.id));
    }else{
      const lock=document.createElement("div");
      lock.className="sticker-lock-text";
      lock.textContent=def.lockedText||"Locked";
      tile.appendChild(lock);
    }

    stickerGrid.appendChild(tile);
  });
}

function createGhost(src,x,y,size=82){
  removeGhost();
  ghost=document.createElement("img");
  ghost.className="drag-ghost";
  ghost.src=src;
  ghost.style.width=size+"px";
  ghost.style.height=size+"px";
  ghost.style.left=x+"px";
  ghost.style.top=y+"px";
  document.body.appendChild(ghost);
}

function moveGhost(x,y){
  if(!ghost) return;
  ghost.style.left=x+"px";
  ghost.style.top=y+"px";
}

function removeGhost(){
  if(ghost){
    ghost.remove();
    ghost=null;
  }
}

function beginDrawerDrag(e,type){
  if(turning) return;
  e.preventDefault();

  const def=STICKERS.find(s=>s.id===type);
  if(!def || !isStickerUnlocked(def)) return;

  pointerMoved=false;
  activeDrag={
    source:"drawer",
    type,
    pointerId:e.pointerId,
    startX:e.clientX,
    startY:e.clientY
  };

  createGhost(def.src,e.clientX,e.clientY);

  window.addEventListener("pointermove",dragMove,{passive:false});
  window.addEventListener("pointerup",dragEnd,{passive:false,once:true});
  window.addEventListener("pointercancel",dragCancel,{passive:false,once:true});
}

function beginPlacedDrag(e,instance){
  if(turning) return;
  e.preventDefault();

  const sticker=state.pages[state.currentPage].find(s=>s.instance===instance);
  if(!sticker) return;

  const def=STICKERS.find(s=>s.id===sticker.type);
  if(!def) return;

  pointerMoved=false;
  activeDrag={
    source:"page",
    instance,
    type:sticker.type,
    pointerId:e.pointerId,
    startX:e.clientX,
    startY:e.clientY
  };

  const pageRect=pageStickers.getBoundingClientRect();
  createGhost(def.src,e.clientX,e.clientY,Math.max(58,pageRect.width*(sticker.scale||.18)));

  window.addEventListener("pointermove",dragMove,{passive:false});
  window.addEventListener("pointerup",dragEnd,{passive:false,once:true});
  window.addEventListener("pointercancel",dragCancel,{passive:false,once:true});
}

function dragMove(e){
  if(!activeDrag) return;
  e.preventDefault();

  if(
    Math.abs(e.clientX-activeDrag.startX)>5 ||
    Math.abs(e.clientY-activeDrag.startY)>5
  ){
    pointerMoved=true;
  }

  moveGhost(e.clientX,e.clientY);
}

function pointToPage(x,y){
  const rect=pageStickers.getBoundingClientRect();

  const inside=
    x>=rect.left &&
    x<=rect.right &&
    y>=rect.top &&
    y<=rect.bottom;

  if(!inside) return null;

  return {
    x:Math.max(0,Math.min(1,(x-rect.left)/rect.width)),
    y:Math.max(0,Math.min(1,(y-rect.top)/rect.height))
  };
}

function dragEnd(e){
  window.removeEventListener("pointermove",dragMove);

  if(!activeDrag){
    removeGhost();
    return;
  }

  e.preventDefault();

  const point=pointToPage(e.clientX,e.clientY);

  if(point){
    if(activeDrag.source==="drawer"){
      state.pages[state.currentPage].push({
        instance:
          Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7),
        type:activeDrag.type,
        x:point.x,
        y:point.y,
        scale:.18,
        rotation:0
      });
    }else{
      const sticker=state.pages[state.currentPage]
        .find(s=>s.instance===activeDrag.instance);

      if(sticker){
        sticker.x=point.x;
        sticker.y=point.y;
      }
    }

    save();
    renderPage();
  }

  activeDrag=null;
  removeGhost();
}

function dragCancel(){
  window.removeEventListener("pointermove",dragMove);
  activeDrag=null;
  removeGhost();
}

function flipTo(target,direction){
  if(turning) return;
  if(target<0 || target>=PAGE_COUNT) return;

  turning=true;
  prevBtn.disabled=true;
  nextBtn.disabled=true;

  underPage.src=THEMES[state.theme].page;
  bookShell.classList.add("turning");

  if(direction==="next"){
    flipStage.classList.add("flipping-next");

    setTimeout(()=>{
      state.currentPage=target;
      save();
      renderPage();

      flipStage.classList.remove("flipping-next");
      bookShell.classList.remove("turning");

      // Reset invisibly before revealing the new current page.
      flipStage.style.opacity="0";
      flipStage.style.transform="none";
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          flipStage.style.opacity="";
          flipStage.style.transform="";
          turning=false;
          renderPage();
        });
      });
    },820);

  }else{
    // Render the previous page first, then animate it down into view.
    state.currentPage=target;
    save();
    renderPage();

    flipStage.classList.add("flipping-prev");

    setTimeout(()=>{
      flipStage.classList.remove("flipping-prev");
      bookShell.classList.remove("turning");
      turning=false;
      renderPage();
    },720);
  }
}

nextBtn.addEventListener("click",()=>{
  flipTo(state.currentPage+1,"next");
});

prevBtn.addEventListener("click",()=>{
  flipTo(state.currentPage-1,"prev");
});

clearPageBtn.addEventListener("click",()=>{
  if(turning) return;
  const count=state.pages[state.currentPage].length;
  if(!count) return;

  if(confirm(`Remove all ${count} sticker${count===1?"":"s"} from this page?`)){
    state.pages[state.currentPage]=[];
    save();
    renderPage();
  }
});

drawerToggle.addEventListener("click",()=>{
  drawer.classList.toggle("collapsed");
  drawerToggle.textContent=drawer.classList.contains("collapsed") ? "+" : "−";
});

document.querySelectorAll(".theme-dot").forEach(btn=>{
  btn.addEventListener("click",()=>setTheme(btn.dataset.theme));
});

/* Double-click / double-tap a placed sticker to remove it. */
let lastStickerTap={instance:null,time:0};

pageStickers.addEventListener("pointerup",e=>{
  const target=e.target.closest?.(".placed-sticker");
  if(!target || pointerMoved) return;

  const instance=target.dataset.instance;
  const now=Date.now();

  if(lastStickerTap.instance===instance && now-lastStickerTap.time<420){
    state.pages[state.currentPage]=state.pages[state.currentPage]
      .filter(s=>s.instance!==instance);
    save();
    renderPage();
    lastStickerTap={instance:null,time:0};
  }else{
    lastStickerTap={instance,time:now};
  }
});

unlockModalBtn.addEventListener("click",closeUnlockPopup);

unlockModal.addEventListener("click",e=>{
  if(e.target===unlockModal) closeUnlockPopup();
});

window.addEventListener("storage",e=>{
  if(e.key===SHARED_COIN_KEY || e.key==="loveAndSweetsBakeryV1"){
    checkRichInLoveUnlock();
  }
});

load();
loadStickerUnlocks();
setTheme(state.theme);
renderStickerDrawer();
renderPage();
checkRichInLoveUnlock();
</script>

    <p id="unlockStickerText"></p>
    <button id="unlockModalBtn">Yay! ♡</button>
  </div>
</div>
